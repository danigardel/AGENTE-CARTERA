name: Daily stock report

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 3 # NUEVO: Si tarda más de 3 minutos, lo aborta por defecto
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restore Gemini analysis cache
        id: gemini-cache-restore
        uses: actions/cache/restore@v4
        with:
          path: gemini_cache.json
          key: gemini-cache-lookup-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            gemini-cache-data-

      - name: Record restored Gemini cache timestamp
        id: gemini-cache-before
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          timestamp = ""
          try:
              timestamp = json.loads(
                  Path("gemini_cache.json").read_text(encoding="utf-8")
              ).get("timestamp", "")
          except (OSError, json.JSONDecodeError, AttributeError):
              pass
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"timestamp={timestamp}\n")
          PY

      - name: Generate daily dashboard
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_CACHE_TIMESTAMP_BEFORE: ${{ steps.gemini-cache-before.outputs.timestamp }}
        run: |
          mkdir -p public
          # Genera el reporte directamente en la carpeta public como index.html
          python daily_report.py --output public/index.html

      - name: Prepare Gemini cache key
        id: gemini-cache-after
        if: always()
        run: |
          python - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          timestamp = ""
          try:
              timestamp = json.loads(
                  Path("gemini_cache.json").read_text(encoding="utf-8")
              ).get("timestamp", "")
          except (OSError, json.JSONDecodeError, AttributeError):
              pass

          before = os.environ.get("GEMINI_CACHE_TIMESTAMP_BEFORE", "")
          should_save = bool(timestamp and timestamp != before)
          key_suffix = re.sub(r"[^A-Za-z0-9_-]", "-", timestamp)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"should_save={'true' if should_save else 'false'}\n")
              if should_save:
                  output.write(f"key=gemini-cache-data-{key_suffix}\n")
          PY

      - name: Save refreshed Gemini analysis cache
        if: success() && steps.gemini-cache-after.outputs.should_save == 'true'
        uses: actions/cache/save@v4
        with:
          path: gemini_cache.json
          key: ${{ steps.gemini-cache-after.outputs.key }}

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
