name: Daily stock report

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

# Esto es crucial: da permiso al bot para escribir en tu repositorio
permissions:
  contents: write

jobs:
  build_and_update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10' # Asegúrate de que coincida con la que usabas

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ejecutar script del reporte
        run: python daily_report.py

      - name: Guardar cambios y subir a GitHub
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add dashboard.html
          # Solo hace commit si hay cambios reales en el archivo
          git diff --quiet && git diff --staged --quiet || git commit -m "📊 Actualizar radar bursátil"
          git push
