name: Daily stock report

on:
  #schedule:
  #  - cron: '*/5 * * * *'
  workflow_dispatch:
  workflow_run:
    workflows: ["Portfolio event agent"]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Test Python dashboard
        run: python -m unittest discover -s tests -v

      - name: Restore latest agent data from data branch
        shell: bash
        run: |
          data_ref="$(git ls-remote --heads origin refs/heads/data)"
          if [ -n "$data_ref" ]; then
            git fetch --no-tags origin refs/heads/data:refs/remotes/origin/data
            for file in gemini_cache.json agent_state.json; do
              if git cat-file -e "refs/remotes/origin/data:$file" 2>/dev/null; then
                git show "refs/remotes/origin/data:$file" > "$file"
              fi
            done
          else
            echo "::warning::La rama data aún no contiene estado del agente."
          fi

      - name: Generate dashboard without AI
        env:
          AI_ENABLED: "false"
          ALERT_DROP_PCT: ${{ vars.ALERT_DROP_PCT }}
          AGENT_STATE_PATH: agent_state.json
        run: |
          mkdir -p public
          python daily_report.py --no-ai --output public/index.html --data-output public/market_data.json

      - name: Verify Pages output
        run: |
          test -s public/index.html
          test -s public/market_data.json
          grep -q 'id="watchlist-heatmap"' public/index.html
          grep -q 'id="portfolio-heatmap"' public/index.html
          grep -q 'id="stock-grid"' public/index.html
          grep -q 'data-sparkline=' public/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        env:
          GITHUB_SHA: ${{ github.run_id }}-${{ github.run_attempt }}
