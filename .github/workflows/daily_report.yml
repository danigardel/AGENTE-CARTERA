name: Daily stock report

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build_and_update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Añadimos --output index.html para que el reporte sea la página principal
      - name: Ejecutar script del reporte
        run: python daily_report.py --output index.html

      - name: Guardar cambios y subir a GitHub
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          # Añadimos index.html al repositorio en lugar de dashboard.html
          git add index.html
          git diff --quiet && git diff --staged --quiet || git commit -m "📊 Actualizar radar bursátil"
          git push
